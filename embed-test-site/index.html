<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test intégration enquête</title>
  <style>
    body{margin:0;padding:32px;font:16px system-ui,sans-serif;color:#172033;background:#f4f6fa}
    main{max-width:720px;margin:auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #17203318}
    h1{margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}
    input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3df;border-radius:8px;font:inherit}
    button{margin-top:20px;color:#fff;background:#c8102e;border:0;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#status{margin-top:20px;padding:14px;border-radius:8px;background:#eef3f8;white-space:pre-line}
  </style>
</head>
<body>
<main>
  <h1>Test de déclenchement</h1>
  <p>Ce site est indépendant de l’application Afriland. L’enquête apparaît dans une fenêtre après le délai choisi.</p>
  <label for="survey-url">URL publique de l’enquête</label>
  <input id="survey-url" value="https://afriland-enquetes-frontend.onrender.com/survey/">
  <label for="delay">Délai avant ouverture (secondes)</label>
  <input id="delay" type="number" min="3" max="10" value="3">
  <button id="start" type="button">Lancer le test</button>
  <div id="status">En attente du test.</div>
</main>
<script>
const status=document.querySelector('#status'),button=document.querySelector('#start');
button.addEventListener('click',()=>{
  const url=document.querySelector('#survey-url').value.trim();
  const seconds=Math.min(10,Math.max(3,Number(document.querySelector('#delay').value)||3));
  if(!url.startsWith('https://')||!url.includes('/survey/')){status.textContent='Erreur : indique une URL publique complète se terminant par la clé de l’enquête.';return}
  button.disabled=true;status.textContent=`✓ Déclencheur installé.\n✓ Ouverture prévue dans ${seconds} seconde(s).`;
  window.setTimeout(()=>{
    const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#0006;z-index:9999;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px;box-sizing:border-box';
    const panel=document.createElement('div');panel.style.cssText='position:relative;width:min(430px,100%);height:min(700px,calc(100vh - 40px));background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #0004';
    const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','Fermer');close.style.cssText='position:absolute;right:8px;top:6px;z-index:1;width:34px;padding:0;border:0;background:#fff;font-size:26px;cursor:pointer';
    const frame=document.createElement('iframe');frame.src=url;frame.title='Questionnaire';frame.style.cssText='width:100%;height:100%;border:0';
    close.onclick=()=>overlay.remove();overlay.onclick=event=>{if(event.target===overlay)overlay.remove()};panel.append(close,frame);overlay.appendChild(panel);document.body.appendChild(overlay);
    status.textContent='✓ Déclencheur exécuté.\n✓ Fenêtre de l’enquête ouverte.';
  },seconds*1000);
});
</script>
</body>
</html>

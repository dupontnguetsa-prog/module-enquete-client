spring.application.name=module-enquete-client
server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.environment=${APP_ENV:development}
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:enquete_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
support.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
support.ai.api-key=${OPENAI_API_KEY:}
support.ai.model=${OPENAI_MODEL:gpt-4o-mini}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPES:openid,profile,email}
spring.security.oauth2.client.registration.google.redirect-uri=${FRONTEND_URL:http://localhost:5173}/login/oauth2/code/{registrationId}
spring.http.converters.preferred-json-mapper=jackson2
